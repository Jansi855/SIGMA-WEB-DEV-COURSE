<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce animation</title>
    <style>
        .container{
           background-color: blue;
           width: 80vw;
           height: 80vh;
           position:absolute;
        
        }
        .box{
            width: 50px;
            height: 50px;
            background-color: blueviolet;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            left:0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Box</div>
    </div>
</body>
</html>
