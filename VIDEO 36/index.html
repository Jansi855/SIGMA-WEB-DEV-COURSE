<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS multicolor website </title>
</head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Poppins&display=swap');
</style>
<style>
    :root{
        --primary-color:#cdb9df;
        --text-color:rgb(211, 47, 47);
        --secondary-color:#29f3e2;
    }
    *{
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
    }
    body{
       background-color: var(--secondary-color); 
    }
    ul li{
        display: inline;
        padding: 15px;
        list-style: none;
        font-weight: bolder;
    }
    ul li a{
         color:var(--text-color);
         text-decoration: none;
    }
    nav{
        background-color:var(--primary-color);
        padding: 12px 0px;
        
    }
</style>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About us</a></li>
                <li><a href="/">Services</a></li>
                <li><a href="/">Contact us</a></li>
            </ul>
        </nav>
    </header>
    
</body>
</html>
