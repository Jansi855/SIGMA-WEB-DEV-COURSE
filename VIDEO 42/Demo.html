<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform by CodeWithHarry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <div class="box">
            <div class="blue scaleX">
                scaleX
            </div>
        </div>

        <div class="box">
            <div class="blue scaleY">
                scaleY
            </div>
        </div>
 <!-- scale:Scales the element on both the X-axis and Y-axis -->
        <div class="box">
            <div class="blue scale">
                scale
            </div>
        </div>
<!-- translateX:move the element along X-axis -->
        <div class="box">
            <div class=" blue translateX">
                translateX
            </div>
        </div>
<!-- translateX:move the element along Y-axis -->
        <div class="box">
            <div class=" blue translateY">
                translateY
            </div>
        </div>
<!-- translateX:move the element along X- axis and Y-axis -->        
        <div class="box">
            <div class=" blue translate">
                translate
            </div>
        </div>
 <!-- matrix: A 2D transformation method using a matrix of six values        -->
        <div class="box">
            <div class=" blue matrix">
                matrix
            </div>
        </div>
<!-- rotate: Rotates the element around the Z-axis         -->
        <div class="box">
            <div class=" blue rotate">
                rotate
            </div>
        </div>
<!-- skew: Skews the element on the X-axis and Y-axis         -->
        <div class="box">
            <div class=" blue skew">
                skew
            </div>
        </div>
<!-- skew: Skews the element on the X-axis          -->        
        <div class="box">
            <div class=" blue skewX">
                skewX
            </div>
        </div>
<!-- skew: Skews the element on the X-axis          -->        
        <div class="box">
            <div class=" blue skewY">
                skewY
            </div>
        </div>
<!-- matrix3D: A 3D transformation method using a matrix of 16 values         -->
       <div class="box">
            <div class=" blue matrix3D">
                matrix3D
            </div>
        </div>
<!-- translate3D: Moves the element along the X-axis,Y-axis and Z-axis         -->
       <div class="box">
            <div class=" blue translate3D">
                translate3D
            </div>
        </div>
<!-- rotatex:Rotate the element around the X-axis -->
        <div class="box">
            <div class=" blue rotateX">
                rotateX
            </div>
        </div>
<!-- rotatex:Rotate the element around the X-axis -->
        <div class="box">
            <div class=" blue rotateY">
                rotateY
            </div>
        </div>

<!-- translateZ: Moves the element along the Z-axis         -->
        <div class="box">
            <div class=" translateZ">
                translateZ
            </div>
        </div>
    </div>
    
    
</body>
</html>
