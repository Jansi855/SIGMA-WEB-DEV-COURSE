<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        .card {
            display: flex;
            border: 2px solid black;
            justify-content: center;
            align-items: center;
            width: 900px;
            height: 125px;
            padding: 12px;
            margin: 3px;
            background-color: white;


        }

        .image img {
            width: 200px;
            
        }

        .text,
        h1,
        p {
            padding: 8px -5px;
            
            
        }

        .image {
            position: relative;
            background-color: white;
        }

        .image .capsule {
            position: absolute;
            bottom: 4px;
            right: 5px;
            background: #262323;
            color: white;
            padding: 3px;
            border-radius: 3px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="image">
                <img src="https://i.ytimg.com/vi/tVzUXW6siu0/hqdefault.jpg?sqp=-oaymwEnCPYBEIoBSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLCKktmHuXV_macV6MoUwhKxwzXJ7w"
                    alt="">
                <div class="capsule">31:06</div>
            </div>
            <div class="text">
                <h1>Installing VS Code & How Websites Work | Sigma Web Development Course #1</h1>
                <p>CodeWithHarry . 727kviews . 2 months ago</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
