<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Outlines</title>
    <style>
        .box{
            border: 2px solid black;
            width: 250px;
            padding: 34px;
            box-shadow: 12px 12px 6px 12px #493580;
        }
        .text-element{
            text-shadow: 13px 12px 2px #941f1f;
        }
    </style>
</head>
<body>
    <div class="box">I am div</div>
    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. 
        Sit recusandae, officia iure quis autem dolor ex voluptatibus 
        quibusdam impedit soluta.
    </p>
</body>
</html>
