<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .element{
            border: 2px solid grey;
            height: 600px;
            width: 400px;
            display: block;
            margin: auto;
            border-radius: 10px;
        }
        .photo>img{
            padding: 5px;
            display: block;
            margin: auto;
            width: 380px;
            height: 250px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- card.png is a file which contains card image.
    Write html and css code to design this card.
    use #HTML -->
    <div class="element">
        <div class="photo">
            <img src="Train image.png" alt="image">
        </div>
        <span>Nature</span>
        <span>Lake</span>
        <h1>Sunset time</h1>
        <p>Arrive at the lake a little before the calculated sunset time to ensure you have enough time to find a good
        spot, set up any equipment, and settle in for the view. You may want to bring a blanket, some snacks, and a
        camera to capture the moment.</p>
        <div id="readmore">Readmore</div>


    </div>
</body>
</html>
