<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selector</title>
    <style>
        /* Element selector */
        div{
            /* background-color: red; */
        }
        /* class selector */
        .red{
            background-color: red;
        }
        /* Id selector */
        #green{
            background-color: green;
        }
        /* child selector */
        div>p{
            color: blue;
            background-color: brown;
        }

    </style>
</head>
<body>
    <div class="red">
        I am div
    </div>
    <div id="green">
        I am another div
    </div>
    <p>I am your dad</p>
    
</body>
</html>
