<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            background-color: aqua;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50vw;
        }
        .container{
            width: 400px;
            border: 2px solid white;
            border-radius: 10px;
            overflow: hidden;
        }
        .top-bar{
            height: 30px;
            background-color: pink;
        }
        .box-section{
            background: linear-gradient(to bottom,green,lightgreen);
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }
        .box{
            width: 120px;
            height: 120px;
            border: 3px solid white;
        }
        .box1{
            background-color: peachpuff;
        }
        .box2{
            background-color: skyblue;
        }
        .bottom{
            background-color: black;
            padding: 30px 10px;
            display: flex;
            justify-content: center;
        }
        .bottom p{
            border: 2px solid white;
            border-radius: 25px;
            padding: 15px 20px;
            color: white;
            text-align: center;
            width: 80%;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top bar -->
        <div class="top-bar"></div>

        <!-- Boxes section -->
         <div class="box-section">
            <div class="box box1"></div>
            <div class="box box2"></div>
         </div>
         <div class="bottom">
            <p>Welcome to sigma web development</p>
         </div>
    </div>
</body>
</html>
