<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 100%;
            display: grid;
            grid-template-columns: 340px auto;
            grid-template-rows: 240px auto;
        }
        .box{
            background-color: bisque;
        }
        .box ul li{
            list-style: none;
            font-family: 'Inter', Helvetica, Arial, Lucida, sans-serif;
        }
        .box ul button{
            background-color: #fcfc65;
        }
        .box p{
            font-size: 8px;
            justify-content: center;
            align-items: baseline;
            padding-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <ul>
                <li>English</li>
                <li>Includes all languages</li>
                <button>Download 64-bit</button>
            </ul>
            <h2>SHA256</h2>
            <p>F57CF8F7D1FE1F065679AD24A2BC428BE9FB61D29761BD179122334B2D41F152</p>
        </div>
    </div>
</body>
</html>
