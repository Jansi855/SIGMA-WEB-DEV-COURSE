<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS position</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box1{
            height: 100px;
            width: 100px;
            background-color: red;
            color: yellow;
            position: absolute;
            left: 25px;
            top: 10px;
            bottom: 0px;
            
        }
        .box2{
            height: 100px;
            width: 100px;
            background-color:blue;
            color: pink;
            position: relative;
            left: 100px;
            top: 100px;
        }
        .box3{
            height: 100px;
            width: 100px;
            background-color:orange;
            color: crimson;
            position:fixed;
            left: 100px;
            top: 100px;
        }  
        .box4{
            height: 100px;
            width: 100px;
            background-color:violet;
            color: rgb(112, 158, 25);
            position: sticky;
            left: 100px;
            top: 100px;
        }  

        .box{
            height: 133px;
            width: 80vw;
            border: 2px solid black;
            padding: 3px;
            margin: 3px;

        }
        .parent{
            margin: 43px;
            padding: 34px;
            border: 3px solid purple;
            position: relative;
            
        }
    </style>
</head>
<body>
    <div class="parent">
    <div class="box box1"> Absolute</div>
    <div class="box box2">relative</div>
    <div class="box box3"> fixed</div>
    <div class="box box4">sticky</div>
    
    </div>
    
    
</body>
</html>
