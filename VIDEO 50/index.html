<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        /* img{
            filter: blur(2px);
        } */
         .img1{
            filter: brightness(2);
         }
         .img2{
            filter: grayscale(100%);
         }
         .img3{
            filter: sepia(100%);
         }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://cdn.pixabay.com/photo/2016/11/21/06/53/beautiful-natural-image-1844362_640.jpg" alt="">
        <img class="img2" src="https://m.media-amazon.com/images/M/MV5BODk3OWIyY2MtM2E0MS00OWYyLTlkNDktMzY4MTE1MDhiYzBiXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="">
        <img class="img3" src="https://in.bmscdn.com/iedb/artist/images/website/poster/large/akshay-kumar-94-1681713982.jpg" alt="">
    </div>
</body>
</html>
