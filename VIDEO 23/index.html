<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS display document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid blue;
            display: inline-block;
            padding: 45px;
            margin: 23px;
        }
        .box1{
            /* display: none; */
            visibility: hidden;
        }
    </style>
</head>

<body>
    <div class="box box1">
        I am box</div>
    <div class="box"> also a nice box</div>
    <span> You are bad</span>
    <span>and I am bad</span>    

</body>

</html>
