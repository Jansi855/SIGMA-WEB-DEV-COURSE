<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a program to calculate factorial number using reduce and using for loop</title>
</head>
<body>
    <script>
        // for loop method
        let n = 6
        let fact = 1;
        for (let i = 1; i <= n; i++) {
            fact = fact*i;
            
            
        }
        console.log(fact);
        
    </script>
</body>
